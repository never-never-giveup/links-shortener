[project]
name = "ai-python-workshop"
version = "0.1.0"
description = "AI-first Python workshop — FastAPI track (link shortener)"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.137.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "basedpyright>=1.21.0",
    "pre-commit>=4.0.0",
    "bandit[toml]>=1.9.0",
    "pip-audit>=2.10.0",
    "locust>=2.32.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["litestar/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN201", "ANN001"]
"alembic/**" = ["ANN", "F401", "E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
exclude = ["alembic/**", ".venv/**", "locustfile.py", "litestar/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
omit = ["alembic/*", "tests/*", "litestar/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = ["if TYPE_CHECKING:", "pragma: no cover", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]
